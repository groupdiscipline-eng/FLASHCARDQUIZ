  }
}

/* ================= PUBLIC QUIZ-TAKE FLOW (no login required) =================
   Reached via the shared QR code / link. Shows a student-info form first
   (Name, Grade & Section, Strand), then the quiz itself, then saves the
   student's info + answers + score to publicQuizzes/{quizId}/submissions
   in Firestore so the teacher can see who has answered. */
let publicQuizRuntime = null; // {quiz, student:{name,gradeSection,strand}, index, answers[], startedAt}
function quizTakeView(quizId){
  if(!quizId) return renderPublicShell(`<div class="empty-card"><div class="icon">⚠️</div><p>This quiz link is missing an ID.</p></div>`);
  if(!window.__publicQuizCache) window.__publicQuizCache = {};
  const cached = window.__publicQuizCache[quizId];

  if(!cached){
    // trigger async load, show loading state meanwhile
    loadPublicQuiz(quizId);
    return renderPublicShell(`<div class="empty-card"><div class="icon">⏳</div><p>Loading quiz…</p></div>`);
  }
  if(cached === 'missing' || cached === 'error'){
    return renderPublicShell(`<div class="empty-card"><div class="icon">⚠️</div><p>${cached==='missing' ? 'This quiz was removed or the link is not valid. Ask your teacher for a new link.' : 'This quiz could not be loaded. Check your connection, or ask your teacher to re-share the link.'}</p></div>`);
  }

  const quiz = cached;
  if(!publicQuizRuntime || publicQuizRuntime.quiz.id !== quizId){
    publicQuizRuntime = { quiz, student:null, index:0, answers:new Array(quiz.questions.length).fill(null), startedAt:null };
  }

  const stateCard = (icon, title, msg, btn)=> renderPublicShell(`<div class="empty-card"><div class="icon">${icon}</div><h1 style="font-size:20px;margin-bottom:8px;">${title}</h1><p>${msg}</p>${btn?'<button class="link-btn" id="ptDiffBtn" style="margin-top:14px;">Not you? Continue as a different student</button>':''}</div>`);
  if(!publicQuizRuntime.student && !publicQuizRuntime.finished){
    if(quizIsExpired(quiz)) return stateCard('⏰','This link is expired','The time to answer this quiz is over. Ask your teacher for a new link.');
    const dev = deviceAnswered(quiz.id) && !window.__anotherStudent;
    if(publicQuizRuntime.alreadyAnswered || dev) return stateCard('✅','This quiz is already answered','Each student can answer this quiz only once.', true);
  }

  if(!publicQuizRuntime.student){
    return renderPublicShell(`
      <h1 style="font-size:20px;margin-bottom:4px;">${escapeHtml(quiz.title)}</h1>
      <p style="color:var(--muted);font-size:13px;margin-bottom:18px;">Please tell us who you are before starting the quiz.</p>
      <div id="ptMsg"></div>
      <form id="ptInfoForm">
        <div class="field"><label>Full Name</label><input type="text" id="pt_name" placeholder="Enter your full name" required></div>
        <div class="field"><label>Grade &amp; Section</label><input type="text" id="pt_grade" placeholder="e.g. Grade 12 - St. Peter" required></div>
        <div class="field"><label>Strand</label><input type="text" id="pt_strand" placeholder="e.g. STEM, ABM, HUMSS" required></div>
        <button class="btn btn-primary" type="submit">Start Quiz →</button>
      </form>`);
  }

  if(publicQuizRuntime.finished){
    const r = publicQuizRuntime.result;
    return renderPublicShell(`
      <div class="done-screen">
        ${brandHtml(true)}
        <h1 style="font-size:22px;margin-bottom:4px;">Quiz Submitted!</h1>
        <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${escapeHtml(quiz.title)}</p>
        <div class="donut" style="margin:0 auto 18px;background:conic-gradient(var(--primary) ${r.percentage*3.6}deg, var(--border) 0deg);">
          <div class="inner"><b>${r.percentage}%</b><span>${r.correct} / ${r.total}</span></div>
        </div>
        <p style="font-size:13.5px;color:var(--muted);">Thanks, ${escapeHtml(publicQuizRuntime.student.studentName)}! Your teacher can now see your result.</p>
        <p style="font-size:12px;color:var(--muted);margin-top:18px;">Made with FlashcardQuiz · You can close this page now.</p>
      </div>
    `, { noBrand:true });
  }

  const q = quiz.questions[publicQuizRuntime.index];
  const pct = Math.round((publicQuizRuntime.index/quiz.questions.length)*100);
  return renderPublicShell(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div><h1 style="font-size:18px;">${escapeHtml(quiz.title)}</h1><p style="font-size:12.5px;color:var(--muted);">Question ${publicQuizRuntime.index+1} of ${quiz.questions.length}</p></div>
    </div>
    <div class="progress-bar" style="margin-bottom:18px;"><div style="width:${pct}%"></div></div>
    <b style="font-size:16px;display:block;margin-bottom:14px;">${escapeHtml(q.text)}</b>
    <div id="ptOptsWrap">
      ${q.options.map((o,i)=>`<div class="quiz-opt ${publicQuizRuntime.answers[publicQuizRuntime.index]===i?'selected':''}" data-oidx="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:18px;">
      <button class="btn btn-outline" id="ptPrevBtn" style="width:auto;padding:10px 20px;" ${publicQuizRuntime.index===0?'disabled':''}>← Previous</button>
      <button class="btn btn-primary" id="ptNextBtn" style="width:auto;padding:10px 20px;">${publicQuizRuntime.index===quiz.questions.length-1?'Submit':'Next →'}</button>
    </div>
  `);
}
function quizIsExpired(q){ return !!q.expiresAt && Date.now() > new Date(q.expiresAt).getTime(); }
function deviceAnswered(id){ try{ return !!localStorage.getItem('fq_answered_'+id); }catch(e){ return false; } }
async function studentKey(quizId, ...parts){
  const s = quizId+'|'+parts.map(p=>p.toLowerCase().replace(/[^a-z0-9]/g,'')).join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function renderPublicShell(inner, opts){
  const noBrand = opts && opts.noBrand;
  return `<div class="auth-shell auth-bg"><div class="auth-form-side" style="width:100%;max-width:620px;margin:0 auto;"><div class="auth-card">${noBrand ? '' : brandHtml()}${inner}</div></div></div>`;
}
async function loadPublicQuiz(quizId){
  try{
    const snap = await getDoc(doc(firestore, 'publicQuizzes', quizId));
    window.__publicQuizCache[quizId] = snap.exists() ? snap.data() : 'missing';
  }catch(e){
    console.error('Load public quiz error:', e);
    window.__publicQuizCache[quizId] = 'error';
  }
  render();
}
function bindQuizTakeHandlers(quizId){
  const diffBtn = document.getElementById('ptDiffBtn');
  if(diffBtn){ diffBtn.addEventListener('click', ()=>{ window.__anotherStudent = true; publicQuizRuntime.alreadyAnswered = false; render(); }); return; }
  const infoForm = document.getElementById('ptInfoForm');
  if(infoForm){
    infoForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const studentName = document.getElementById('pt_name').value.trim();
      const gradeSection = document.getElementById('pt_grade').value.trim();
      const strand = document.getElementById('pt_strand').value.trim();
      if(!studentName || !gradeSection || !strand){
        document.getElementById('ptMsg').innerHTML = `<div class="err-msg">Please fill in all fields.</div>`;
        return;
      }
      const quiz = publicQuizRuntime.quiz;
      if(quizIsExpired(quiz)){ render(); return; }
      const btn = infoForm.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
      let done = false;
      try{
        publicQuizRuntime.key = await studentKey(quiz.id, studentName, gradeSection, strand);
        done = (await getDoc(doc(firestore, 'publicQuizzes', quiz.id, 'answered', publicQuizRuntime.key))).exists();
      }catch(err){ console.error('Answered check error:', err); }
      if(done){ publicQuizRuntime.alreadyAnswered = true; render(); return; }
      publicQuizRuntime.student = { studentName, gradeSection, strand };
      publicQuizRuntime.startedAt = Date.now();
      render();
    });
    return;
  }
  const optsWrap = document.getElementById('ptOptsWrap');
  if(optsWrap){
    optsWrap.querySelectorAll('.quiz-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        publicQuizRuntime.answers[publicQuizRuntime.index] = +el.dataset.oidx;
        optsWrap.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  }
  const prevBtn = document.getElementById('ptPrevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ publicQuizRuntime.index--; render(); });
  const nextBtn = document.getElementById('ptNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', async ()=>{
    if(publicQuizRuntime.answers[publicQuizRuntime.index]===null){ if(!confirm('No answer selected. Continue anyway?')) return; }
    if(publicQuizRuntime.index < publicQuizRuntime.quiz.questions.length-1){
      publicQuizRuntime.index++;
      render();
    } else {
      nextBtn.disabled = true; nextBtn.textContent = 'Submitting…';
      if(!(await submitPublicQuiz())){ nextBtn.disabled = false; nextBtn.textContent = 'Submit'; }
    }
  });
}
async function submitPublicQuiz(){
  const quiz = publicQuizRuntime.quiz;
  let correct = 0;
  quiz.questions.forEach((q,i)=>{ if(publicQuizRuntime.answers[i]===q.answerIndex) correct++; });
  const total = quiz.questions.length;
  const percentage = Math.round((correct/total)*100);
  const timeSpentSec = Math.floor((Date.now()-publicQuizRuntime.startedAt)/1000);
  const submission = {
    id: publicQuizRuntime.subId || (publicQuizRuntime.subId = uid('sub')),
    quizId: quiz.id,
    quizTitle: quiz.title,
    studentName: publicQuizRuntime.student.studentName,
    gradeSection: publicQuizRuntime.student.gradeSection,
    strand: publicQuizRuntime.student.strand,
    answers: publicQuizRuntime.answers.slice(),
    correct, total, percentage, timeSpentSec,
    submittedAt: nowISO()
  };
  try{
    await withTimeout(setDoc(doc(firestore, 'publicQuizzes', quiz.id, 'submissions', submission.id), submission), 20000);
  }catch(e){
    console.error('Submit quiz error:', e);
    toast('Could not submit — please check your connection and try again.');
    return false;
  }
  if(publicQuizRuntime.key){ try{ await setDoc(doc(firestore, 'publicQuizzes', quiz.id, 'answered', publicQuizRuntime.key), { answeredAt: nowISO() }); }catch(e){ console.error('Answered marker error:', e); } }
  try{ localStorage.setItem('fq_answered_'+quiz.id, nowISO()); }catch(e){}
  publicQuizRuntime.finished = true;
  publicQuizRuntime.result = { correct, total, percentage };
  render();
  return true;
}

    <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">Paste your Anthropic API key so quiz generation and summaries use real AI. The key is saved only on this device.</p>
    <div class="field"><input type="password" id="aiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(localStorage.getItem('fq_ai_key')||'')}"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="aiKeySaveBtn" style="width:auto;">Save key</button>
      <button class="pill-btn" id="aiKeyTestBtn">Test connection</button>
      <button class="pill-btn" id="aiKeyClearBtn" style="color:var(--danger);">Remove key</button>
    </div>
    <p id="aiKeyStatus" style="font-size:12.5px;margin-top:10px;color:var(--muted);">${localStorage.getItem('fq_ai_key') ? 'A key is saved on this device.' : 'No key saved. The basic generator is used instead.'}</p>
    <div class="nav-sep"></div>
    <div class="section-title">Theme Settings</div>
    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="pill-btn ${theme==='light'?'':''}" id="lightModeBtn" style="flex:1;${theme==='light'?'border-color:var(--primary);color:var(--primary);':''}">☀️ Light Mode</button>
      <button class="pill-btn" id="darkModeBtn" style="flex:1;${theme==='dark'?'border-color:var(--primary);color:var(--primary);':''}">🌙 Dark Mode</button>
    </div>
    <div class="nav-sep"></div>
    <button class="btn btn-danger" id="settingsLogoutBtn">🚪 Logout</button>
  </div>`;
}
function bindSettingsHandlers(){
  const keyIn = document.getElementById('aiKeyInput'), keySt = document.getElementById('aiKeyStatus');
  document.getElementById('aiKeySaveBtn').addEventListener('click', ()=>{
    const k = keyIn.value.trim();
    if(!k){ keySt.style.color = 'var(--danger)'; keySt.textContent = 'Paste your API key first.'; return; }
    localStorage.setItem('fq_ai_key', k); keySt.style.color = ''; keySt.textContent = 'Key saved on this device. Tap Test connection to check it.';
  });
  document.getElementById('aiKeyClearBtn').addEventListener('click', ()=>{
    localStorage.removeItem('fq_ai_key'); keyIn.value = ''; keySt.style.color = ''; keySt.textContent = 'Key removed. The basic generator is used instead.';
  });
  document.getElementById('aiKeyTestBtn').addEventListener('click', async ()=>{
    keySt.style.color = ''; keySt.textContent = 'Testing…';
    const s = await getSampler();
    if(!s){ keySt.style.color = 'var(--danger)'; keySt.textContent = 'No key saved yet. Paste your key and tap Save key.'; return; }
    try{ const r = await s('Reply with the single word OK.'); keySt.style.color = 'var(--success)'; keySt.textContent = r && r.text ? 'Connected. AI is ready.' : 'Connected, but the reply was empty.'; }
    catch(e){ keySt.style.color = 'var(--danger)'; keySt.textContent = 'Could not connect: ' + (e && e.message ? e.message : 'check your key and internet.'); }
  });
  document.getElementById('toggleEmail').addEventListener('click', ()=>{ const s=mySettings(); s.emailNotif=!s.emailNotif; saveSettings(s); render(); });
  document.getElementById('toggleReminder').addEventListener('click', ()=>{ const s=mySettings(); s.quizReminders=!s.quizReminders; saveSettings(s); render(); });
  document.getElementById('lightModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'light'); applyTheme(); render(); });
  document.getElementById('darkModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'dark'); applyTheme(); render(); });
  document.getElementById('settingsLogoutBtn').addEventListener('click', async ()=>{ try{ await signOut(auth); }catch(e){ console.error('Logout error:',e); } finally{ setSession(null); go('/login'); } });
}

/* ================= GUIDE ================= */
let guideTab = 'teacher';
function guideStep(icon, title, body){
  return `<div class="q-card" style="display:flex;gap:14px;align-items:flex-start;">
    <div class="stat-card icon" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;">${icon}</div>
    <div><b style="font-size:14px;">${title}</b><p style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;">${body}</p></div>
  </div>`;
}
function guideView(){
  const teacherSteps = [
    guideStep('🔑','Create an account / log in', 'On the login screen, choose <b>Teacher</b>, then tap "Create one" to sign up with your name, email and password, or log back in any time with the same email and password. Your account and everything in it follow you to any device you log into.'),
    guideStep('📤','Upload a PowerPoint', 'Go to <b>Upload PPT</b>, drag in a .pptx file (or tap to browse), and the app extracts the text from every slide. The original file is stored permanently under your account, so it is available again later even after logging out or switching devices.'),
    guideStep('✨','Generate an AI quiz', 'From an uploaded PPT, tap <b>Generate AI Quiz</b>. The app reads the slide content and drafts multiple-choice questions for you, which you can review and edit on the next screen before saving.'),
    guideStep('✏️','Build a quiz manually', 'Use <b>Create Quiz</b> to add your own questions and answer choices from scratch, mark the correct answer, and set a title, subject and difficulty.'),
    guideStep('💾','Save and manage quizzes', 'Every quiz you create or generate is saved permanently to your account in the cloud. Open <b>My Quizzes</b> to see, edit, retitle or delete any quiz you own — changes sync back to your account automatically.'),
    guideStep('🔗','Share a quiz link or QR code', 'From <b>My Quizzes</b>, open a quiz and tap <b>Share</b> to get a public link and a scannable QR code. Anyone with the link or code can open and take the quiz instantly — no account or login required on their end.'),
    guideStep('📈','View scores and submissions', 'Open a quiz\'s <b>Submissions</b> tab to see every student who has taken it, their name/info, their answers and their score, as students complete it.'),
    guideStep('🗂️','Flashcards & other tools', 'Use <b>Flashcards</b> to turn any quiz or deck into flip-cards for studying, and check <b>History</b> for a record of quizzes you have taken yourself.'),
  ].join('');
  const studentSteps = [
    guideStep('🔑','Create an account / log in', 'On the login screen, choose <b>Student</b>, then create an account with your name, email and password (or log back in later). This lets you save AI review notes and your own quiz history.'),
    guideStep('🔗','Open a shared quiz', 'Tap the link your teacher shared, or open the camera app and scan the QR code they provided. The quiz opens right away — you do not need to log in or create an account just to take a shared quiz.'),
    guideStep('📝','Submit your info and answer', 'Enter your name (and any info requested) once, then answer each question. Your answers are saved as you go, so a lost connection or refresh will not lose your progress.'),
    guideStep('✅','View your results', 'After submitting, you will immediately see your score and a review of which answers were correct. Your teacher can also see your submission and score on their end.'),
    guideStep('📤','Upload a PPT for yourself', 'If you want to study your own material, use <b>Upload PPT</b> to add a PowerPoint, then <b>AI Summarize/Review</b> to get an AI-written summary and review notes from its content.'),
  ].join('');
  return `
  <div class="page-head"><h1>Guide</h1><p>Everything you need to use FlashcardQuiz, for teachers and students.</p></div>
  <div class="login-role-tabs" style="max-width:420px;">
    <button type="button" class="pill-btn role-btn ${guideTab==='teacher'?'selected':''}" id="guideTeacherBtn" data-tab="teacher">🧑‍🏫<br>For Teachers</button>
    <button type="button" class="pill-btn role-btn ${guideTab==='student'?'selected':''}" id="guideStudentBtn" data-tab="student">🎓<br>For Students</button>
  </div>
  <div id="guideBody" style="max-width:720px;">${guideTab==='teacher'?teacherSteps:studentSteps}</div>`;
}
function bindGuideHandlers(){
  const teacherBtn = document.getElementById('guideTeacherBtn');
  const studentBtn = document.getElementById('guideStudentBtn');
  if(teacherBtn) teacherBtn.addEventListener('click', ()=>{ guideTab='teacher'; render(); });
  if(studentBtn) studentBtn.addEventListener('click', ()=>{ guideTab='student'; render(); });
}

/* ================= PAGE HANDLER DISPATCH ================= */
function bindPageHandlers(path){
  const [p, param] = path.split('?');
  if(p==='/create-manual') bindManualQuizHandlers(param);
  else if(p==='/generate-ai') bindGenerateAiHandlers();
  else if(p==='/upload-ppt') bindUploadPptHandlers();
  else if(p==='/ai-review') bindAiReviewHandlers();
  else if(p==='/my-quizzes') bindMyQuizzesHandlers();
  else if(p==='/quiz-submissions'){ if(!isStudentUser()) bindQuizSubmissionsHandlers(param); }
  else if(p==='/quiz-play') bindQuizPlayHandlers();
  else if(p==='/quiz-results') bindQuizResultsHandlers();
  else if(p==='/flashcards') bindFlashcardsListHandlers();
  else if(p==='/flashcards-study') bindFlashcardStudyHandlers();
  else if(p==='/profile') bindProfileHandlers();
  else if(p==='/settings') bindSettingsHandlers();
  else if(p==='/guide') bindGuideHandlers();
}
</script>
