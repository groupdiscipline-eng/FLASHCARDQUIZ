<style>
:root{
  --primary:#016af3; --primary-dark:#013376; --accent:#2f80ff; --navy:#013376; --gold:#fecb32; --heading:#013376;
  --bg:#f1f5fc; --surface:#ffffff; --surface-2:#f7f8fd;
  --text:#151a2d; --muted:#6b7280; --border:#e6e9f4;
  --success:#22c55e; --success-bg:#e9f9ef; --danger:#e63946; --danger-bg:#fdecec;
  --warn:#f59e0b; --warn-bg:#fef3e0;
  --shadow: 0 1px 2px rgba(20,25,50,.04), 0 6px 20px rgba(20,25,50,.06);
  --radius:14px;
  --sidebar-bg:#012b60; --sidebar-text:#e3ecfc; --sidebar-border:#0d3f80;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --heading:#eef0fb; --bg:#11131f; --surface:#181b2b; --surface-2:#1f2338;
    --text:#eef0fb; --muted:#9aa0bd; --border:#2a2f47;
    --success-bg:#123322; --danger-bg:#3a1a1a; --warn-bg:#3a2a10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --heading:#eef0fb; --bg:#11131f; --surface:#181b2b; --surface-2:#1f2338;
  --text:#eef0fb; --muted:#9aa0bd; --border:#2a2f47;
  --success-bg:#123322; --danger-bg:#3a1a1a; --warn-bg:#3a2a10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.hidden{display:none !important;}
.wrap-x{overflow-x:auto;}

.boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.boot-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:boot-spin .7s linear infinite;}
@keyframes boot-spin{to{transform:rotate(360deg);}}

/* ---------- Auth pages ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:stretch;justify-content:center;}
.auth-visual{flex:1;max-width:480px;background:linear-gradient(160deg,#151a3d 0%,#241a5e 55%,#3a1f7a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 36px;color:#fff;text-align:center;}
.auth-visual img{width:190px;height:190px;object-fit:contain;margin-bottom:28px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));}
.auth-visual h2{font-size:26px;margin-bottom:10px;}
.auth-visual p{color:rgba(255,255,255,.75);font-size:14px;max-width:320px;}
@media(max-width:820px){.auth-visual{display:none;}}
.auth-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:36px 32px;width:100%;max-width:400px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand .logo{width:38px;height:38px;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(67,97,238,.35);}
.brand .logo img{width:100%;height:100%;object-fit:cover;}
.brand .name{font-family:'Sora';font-weight:700;font-size:18px;}
.brand .name span{color:var(--primary);}
.brand.big{flex-direction:column;justify-content:center;gap:14px;margin:4px 0 16px;animation:fqPop .8s cubic-bezier(.2,1.4,.4,1) both;}
.brand.big .logo{width:104px;height:104px;border-radius:28px;box-shadow:0 14px 36px rgba(67,97,238,.45);}
.brand.big .name{font-size:28px;}
@keyframes fqPop{from{opacity:0;transform:scale(.55) translateY(12px);}to{opacity:1;transform:none;}}
.done-screen{text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted);}
.field input{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14.5px;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--primary);}
.field-pw{position:relative;}
.field-pw button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:4px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14.5px;transition:transform .08s, filter .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;width:100%;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);width:100%;}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.err-msg{background:var(--danger-bg);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;font-weight:500;}
.ok-msg{background:var(--success-bg);color:var(--success);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;font-weight:500;}
.divider-txt{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 0;position:relative;}
.link-btn{background:none;border:none;color:var(--primary);font-weight:600;font-size:13.5px;padding:0;}
.muted-link{color:var(--muted);font-size:13.5px;}
.center-txt{text-align:center;}
.perk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px;}
.perk .dot{width:18px;height:18px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);flex:none;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar .brand{padding:4px 6px 18px;}
.sidebar .brand .name{color:#fff;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--sidebar-text);margin-bottom:2px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item .ic{width:18px;text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(67,97,238,.35);}
.nav-sep{height:1px;background:var(--sidebar-border);margin:12px 4px;}
.nav-logout{margin-top:auto;color:#fb7185;}
.nav-logout:hover{background:rgba(251,113,133,.12);}

.main{flex:1;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5;}
.topbar .search{flex:1;max-width:340px;position:relative;}
.topbar .search input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.5px;outline:none;}
.topbar .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
.topbar-user{display:flex;align-items:center;gap:10px}@media(max-width:700px){.topbar-user{gap:6px}.topbar-user>span{font-size:11px!important}}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.page{padding:26px;max-width:1180px;}
.page-head{margin-bottom:20px;}
.page-head h1{font-size:22px;}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
@media(max-width:600px){.grid-4{grid-template-columns:1fr 1fr;}}

.stat-card{display:flex;flex-direction:column;gap:10px;}
.stat-card .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.stat-card .num{font-size:24px;font-weight:800;font-family:'Sora';}
.stat-card .lbl{font-size:12.5px;color:var(--muted);font-weight:600;}

.section-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.action-tile{border:none;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:#fff;transition:transform .12s, filter .15s;box-shadow:0 6px 18px rgba(20,25,50,.12);}
.action-tile:hover{transform:translateY(-2px);filter:brightness(1.05);}
.action-tile .icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;}
.action-tile b{font-size:14.5px;}
.action-tile span{font-size:12.5px;color:rgba(255,255,255,.85);}
.action-tile.tile-purple{background:linear-gradient(135deg,#7c3aed,#4361ee);}
.action-tile.tile-blue{background:linear-gradient(135deg,#2563eb,#38bdf8);}
.action-tile.tile-green{background:linear-gradient(135deg,#16a34a,#22c55e);}
.action-tile.tile-yellow{background:linear-gradient(135deg,#f59e0b,#fbbf24);}
.action-tile.tile-pink{background:linear-gradient(135deg,#ec4899,#f472b6);}
.empty-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;}
.empty-card .icon{font-size:28px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.form-row{grid-template-columns:1fr;}}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.tag-easy{background:var(--success-bg);color:var(--success);}
.tag-medium{background:var(--warn-bg);color:var(--warn);}
.tag-hard{background:var(--danger-bg);color:var(--danger);}
.tag-blue{background:#e6ebff;color:var(--primary);}
:root[data-theme="dark"] .tag-blue{background:#232a55;}

.q-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface-2);}
.q-card .qh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;}
.opt-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.opt-row input[type=text]{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;}
.opt-radio{width:16px;height:16px;flex:none;}

.dropzone{border:2px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone.drag{border-color:var(--primary);background:#eef1ff;}
.dropzone .icon{font-size:34px;margin-bottom:10px;}
.progress-bar{height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:var(--primary);border-radius:6px;transition:width .2s;}

.quiz-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font-size:14.5px;transition:border-color .15s,background .15s;}
.quiz-opt:hover{border-color:var(--primary);}
.quiz-opt.selected{border-color:var(--primary);background:#eef1ff;}
:root[data-theme="dark"] .quiz-opt.selected{background:#1c2350;}
.quiz-opt.correct{border-color:var(--success);background:var(--success-bg);}
.quiz-opt.incorrect{border-color:var(--danger);background:var(--danger-bg);}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}

.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none;}
.donut .inner{width:112px;height:112px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .inner b{font-size:26px;font-family:'Sora';}
.donut .inner span{font-size:11.5px;color:var(--muted);}

.flip-card{width:100%;max-width:460px;height:260px;margin:0 auto;perspective:1200px;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;font-size:18px;font-weight:600;font-family:'Sora';}
.flip-front{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
.flip-back{background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);transform:rotateY(180deg);font-weight:500;font-size:16px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:none;padding:10px 12px;border-bottom:1px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}

  .toggle{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex:none;border:none;}
.toggle.on{background:var(--primary);}
.toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
.toggle.on .knob{left:21px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

.empty{text-align:center;padding:44px 20px;color:var(--muted);}
.empty .icon{font-size:36px;margin-bottom:10px;}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,25,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:var(--shadow);}

.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-btn:hover{color:var(--text);border-color:var(--primary);}
.pill-btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--text);}
.role-btn{cursor:pointer;text-align:center;font-size:13px;line-height:1.5;transition:.15s;}
.role-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff;}
.login-role-tabs{display:flex;gap:8px;margin-bottom:18px;}
.login-role-tabs .role-btn{flex:1;padding:10px 6px;}
.qr-share-wrap{text-align:center;}
.qr-share-wrap img{max-width:340px;width:100%;border:1px solid var(--border);border-radius:10px;margin:0 auto;display:block;}
.sub-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sub-table th,.sub-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
.pill-btn:hover{border-color:var(--primary);color:var(--primary);}

@media(max-width:820px){
  .sidebar{position:fixed;left:-240px;z-index:50;transition:left .2s;box-shadow:var(--shadow);}
  .sidebar.open{left:0;}
  .page{padding:16px;}
  .topbar{padding:12px 16px;}
}

/* ===== Sto. Niño Mactan Montessori theme ===== */
h1,h2,h3,h4,.section-title{color:var(--heading);}
.card{border-radius:12px;box-shadow:0 2px 10px rgba(1,51,118,.07);}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:hover{filter:brightness(1.04);}
.page{max-width:1240px;}
.page-head h1{font-size:23px;}
/* auth */
.auth-visual{max-width:none;flex:1.15;padding:0;background:#0b57c7;}
.auth-visual img{width:100%;height:100%;object-fit:cover;margin:0;filter:none;}
.auth-card{border-radius:16px;}
.auth-card .btn-primary{background:var(--navy);}
.brand .logo{border-radius:50%;box-shadow:none;background:none;}
.brand.big .logo{border-radius:50%;box-shadow:0 10px 28px rgba(1,51,118,.3);}
.brand .name span{color:var(--primary);}
.role-btn.selected{border-color:var(--navy);background:var(--navy);color:#fff;}
/* sidebar */
.sidebar{width:232px;padding:22px 12px 16px;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;line-height:1.25;}
.sb-brand img{width:46px;height:46px;flex:none;}
.nav-item{padding:11px 14px;border-radius:9px;font-weight:600;}
.nav-item:hover{background:rgba(255,255,255,.09);}
.nav-item.active{background:var(--gold);color:var(--navy);box-shadow:none;font-weight:700;}
.nav-logout{margin-top:0;}
.sb-foot{margin-top:auto;padding:22px 6px 4px;text-align:center;}
.sb-foot div{font-family:'Dancing Script',cursive;color:var(--gold);font-size:22px;line-height:1.05;transform:rotate(-5deg);}
/* topbar */
.topbar{background:var(--navy);border:none;padding:10px 24px;gap:18px;}
.tb-brand{display:flex;align-items:center;gap:8px;font-family:'Sora',sans-serif;font-weight:800;font-size:19px;color:#fff;white-space:nowrap;}
.tb-brand span{color:var(--gold);}
.topbar .search{max-width:none;margin:0 auto 0 8px;}

.topbar .icon-btn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff;}
.topbar-user{color:#fff;}
.tb-user-txt{line-height:1.2;}
.tb-user-txt b{display:block;font-size:12.5px;}
.tb-user-txt small{font-size:10.5px;color:#c9d8f3;}
.avatar{background:var(--gold);color:var(--navy);box-shadow:0 0 0 2px #fff;}

.hero h1{color:#013376;font-size:26px;}
.hero p{color:#0b3a7e;font-weight:600;margin-top:4px;font-size:14.5px;}
.hero-av{width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--navy);border:4px solid #fff;display:flex;align-items:center;justify-content:center;font:800 26px 'Sora',sans-serif;flex:none;}
.stat2{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.stat2 .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.stat2 .n{font:800 26px 'Sora',sans-serif;color:var(--heading);line-height:1.1;}
.stat2 .l{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);}
.action-tile{border-radius:12px;padding:16px 18px;position:relative;box-shadow:none;min-height:104px;}
.action-tile::after{content:'›';position:absolute;right:14px;bottom:10px;font-size:24px;}
.action-tile .icon{background:rgba(255,255,255,.92);}
.action-tile.tile-blue{background:#016af3;}
.action-tile.tile-yellow{background:#fecb32;color:#013376;}
.action-tile.tile-yellow span{color:#3b4f7a;}
.action-tile.tile-green{background:#1eb364;}
.action-tile.tile-purple{background:#8551e5;}
.card-h{display:flex;align-items:center;gap:10px;font:700 15px 'Sora',sans-serif;color:var(--heading);margin-bottom:14px;}
.card-h span{color:var(--primary);}
/* create quiz */
.ctabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.ctab{flex:1;min-width:150px;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:14px;color:var(--heading);}
.ctab.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 16px rgba(1,106,243,.28);}
.up-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start;}
@media(max-width:900px){.up-grid{grid-template-columns:1fr;}}
.dropzone{border:2px dashed #7fb0f5;padding:38px 20px;}
.dz-ic{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}
.how-step{display:flex;gap:12px;margin-top:16px;}
.how-step i{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font:700 12.5px 'Sora',sans-serif;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;}
.how-step b{display:block;font-size:13.5px;color:var(--heading);}
.how-step span{font-size:12px;color:var(--muted);}
/* my quizzes */
.qhead,.qrow{display:grid;grid-template-columns:minmax(0,3fr) 100px 110px 120px auto;gap:12px;align-items:center;padding:14px 16px;}
.qhead{font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);}
.qrow{border-bottom:1px solid var(--border);font-size:13px;}
.qrow:last-child{border-bottom:none;}
.q-title{display:flex;gap:12px;align-items:center;min-width:0;}
.q-title b{font-size:14px;color:var(--heading);}
.q-title small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
.q-ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.src{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:#fff3cf;color:#8a6100;margin-left:8px;}
.src.ai{background:#dfe9ff;color:#0a4fc0;}
.src.ppt{background:#efe4ff;color:#6b35c4;}
.st{font-size:12px;font-weight:700;}
.st.done{color:#12904a;}
.st.no{color:#0a4fc0;}
.q-act{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.q-act .btn{width:auto;}
@media(max-width:820px){.qhead{display:none;}.qrow{grid-template-columns:1fr;}.qc,.qd{display:none;}.q-act{justify-content:flex-start;}}
/* flashcards */
.deck{border:1px solid;border-radius:12px;padding:16px;}
.deck .di{width:38px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;}
.deck b{display:block;margin-top:10px;font-size:14.5px;color:#0b2a5c;}
.deck p{font-size:12px;color:#5b6b8c;margin:2px 0 14px;}
.deck .btn{background:#fff;color:#0b2a5c;border:1px solid rgba(0,0,0,.08);}
/* mobile tab bar */
.tabbar{display:none;}
@media(max-width:820px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
  .tabbar button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;}
  .tabbar button.on{color:var(--primary);}
  .tabbar .ti{font-size:19px;}
  .main{padding-bottom:72px;}
  .topbar .search,.tb-user-txt{display:none;}
  .topbar{padding:10px 14px;}
  .tb-brand{margin-right:auto;}
  .hero{padding:16px;}
  .hero-av{width:56px;height:56px;font-size:20px;}
  .hero h1{font-size:21px;}

        }
      }
    );
  });

function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const t = setTimeout(()=> reject(new Error('timeout')), ms);

  });
}

async function extractPptxText(file){
  const zip = await JSZip.loadAsync(file);
  const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  slideFiles.sort((a,b)=>{
    const na = parseInt(a.match(/slide(\d+)\.xml/)[1]), nb = parseInt(b.match(/slide(\d+)\.xml/)[1]);
    return na-nb;
  });
  const slides = [];
  for(const name of slideFiles){
    const xml = await zip.files[name].async('string');
    const texts = [...xml.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m=>m[1]);
    const joined = texts.join(' ').replace(/\s+/g,' ').trim();
    if(joined) slides.push(joined);
  }
  return slides;
}

/* ---------------- rule-based quiz generator (fallback) ---------------- */
const STOPWORDS = new Set(['the','a','an','is','are','was','were','of','in','on','at','to','for','and','or','with','by','as','that','this','it','be','from','which','their','its','has','have','had','will','can','also','into','than','these','those','such','not','but','all','more','most','other','some','then','so','if','because']);
function pickKeyword(sentence){
  const words = sentence.replace(/[^a-zA-Z0-9\s\-]/g,'').split(/\s+/).filter(w=>w.length>3 && !STOPWORDS.has(w.toLowerCase()));
  if(!words.length) return null;
  words.sort((a,b)=> b.length-a.length);
  return words[0];
}
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ruleBasedQuiz(slideTexts, count, difficulty){
  const allText = slideTexts.join(' ');
  const sentences = allText.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>25 && s.length<200);
  const allWords = [...new Set(allText.replace(/[^a-zA-Z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>4 && !STOPWORDS.has(w.toLowerCase())))];
  const questions = [];
  const used = new Set();
  for(const s of shuffleArr(sentences)){
    if(questions.length>=count) break;
    const kw = pickKeyword(s);
    if(!kw || used.has(kw.toLowerCase())) continue;
    used.add(kw.toLowerCase());
    const blanked = s.replace(new RegExp('\\b'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'_____');
    if(blanked===s) continue;
    let distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
    while(distractors.length<3) distractors.push('None of these');
    const options = shuffleArr([kw, ...distractors]);
    questions.push({ id:uid('q'), text:`Fill in the blank: "${blanked}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
  }
     // pad with slide-topic questions if not enough
  let i=0;
  const maxPad = Math.max(slideTexts.length*3, count*4, 20);
  while(questions.length<count && slideTexts.length && i<maxPad){
    const t = slideTexts[i % slideTexts.length];
    const kw = pickKeyword(t);
    if(kw && !used.has(kw.toLowerCase())){
      used.add(kw.toLowerCase());
      const distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
      while(distractors.length<3) distractors.push('None of these');
      const options = shuffleArr([kw, ...distractors]);
      questions.push({ id:uid('q'), text:`Which term relates most to: "${t.slice(0,80)}${t.length>80?'…':''}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
    }
    i++;
  }
  // final guaranteed pad: if the source material is too short/thin to reach the
  // requested count from real sentences, fill the remainder with clearly-labeled
  // generic review questions so the user always gets exactly the number they asked for.
  const topicGuess = (slideTexts[0]||'this topic').slice(0,60);
  let g = 1;
  while(questions.length<count){
    const pool = allWords.length ? allWords : [topicGuess];
    const kw = shuffleArr(pool)[0] || topicGuess;
    const distractors = shuffleArr(pool.filter(w=>w!==kw)).slice(0,3);
    while(distractors.length<3) distractors.push(`Option ${distractors.length+2}`);
    const options = shuffleArr([kw, ...distractors]);
    questions.push({ id:uid('q'), text:`Review question ${g}: Which of these is most associated with "${topicGuess}${topicGuess.length>=60?'…':''}"?`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
    g++;
  }
  return questions.slice(0,count);
                                    }

  const seen = new Set();

      if(!correct || bad.test(correct)) return;
      const wrong = [];
      q.options.forEach((o,i)=>{
        const s = String(o).trim();
        if(i===ai || !s || bad.test(s) || s.toLowerCase()===correct.toLowerCase() || wrong.some(w=>w.toLowerCase()===s.toLowerCase())) return;
        wrong.push(s);
      });
      if(wrong.length < 2) return;
      const options = shuffleArr([correct, ...wrong.slice(0,3)]);
      seen.add(text.toLowerCase());
      out.push({ id:uid('q'), text, options, answerIndex: options.indexOf(correct), difficulty: diff, explanation: String(q.explanation||'').trim() });
    });
    return out;
  };
  const verify = async (qs)=>{
    if(!qs.length) return qs;
    const list = qs.map((q,i)=>({ i, text:q.text, options:q.options, answerIndex:q.answerIndex }));
    const vp = `You are a strict fact-checker for Grade 11-12 ${subj || 'subject'} test items${scope ? ' ('+scope+')' : ''}. ${hasMaterial ? 'The MATERIAL below is the only source of truth.' : 'Use standard curriculum knowledge.'}
${hasMaterial ? 'MATERIAL:\n"""'+material+'"""\n' : ''}For each question check: (a) the marked answerIndex is correct, (b) it is the ONLY correct option, (c) the question is unambiguous${hasMaterial ? ' and supported by the material' : ''}.
Respond with ONLY a raw JSON array like [{"i":0,"ok":true,"answerIndex":0}]. If a question is wrong, ambiguous or unsupported, set "ok":false. If the marked answer is wrong but exactly one other option is clearly correct, set "ok":true and give that answerIndex.
QUESTIONS:
${JSON.stringify(list)}`;
    const res = await askJson(vp);
    if(!Array.isArray(res)) return qs;
    const map = new Map(res.map(r=>[r && r.i, r]));
    const kept = qs.filter((q,i)=>{
      const r = map.get(i);
      if(!r) return true;
      if(r.ok === false) return false;
      if(Number.isInteger(r.answerIndex) && r.answerIndex >= 0 && r.answerIndex < q.options.length) q.answerIndex = r.answerIndex;
      return true;
    });
    return kept.length >= Math.min(count, qs.length)/2 ? kept : qs;
  };
  const extra = Math.min(5, Math.ceil(count*0.2));
  let out = clean(await askJson(gen(count+extra)));
  if(out.length < count) out = out.concat(clean(await askJson(gen(count-out.length, out.map(q=>q.text)))));
  if(!out.length) return null;
  out = await verify(out);
  if(out.length < count) out = out.concat(clean(await askJson(gen(count-out.length, out.map(q=>q.text)))));
  return out.slice(0, count);
}

/* ---------------- enforce exact question count ---------------- */
function ensureCount(questions, contextTexts, count, difficulty){
  let qs = (questions||[]).slice(0, count);
  if(qs.length < count){
    const need = count - qs.length;
    const extra = ruleBasedQuiz(contextTexts, need, difficulty);
    const existingTexts = new Set(qs.map(q=>q.text));
    for(const e of extra){
      if(qs.length >= count) break;
      if(!existingTexts.has(e.text)){ qs.push(e); existingTexts.add(e.text); }
    }
  }
  return qs.slice(0, count);
}

/* ================= RENDER ROUTER ================= */
const PUBLIC_PATHS = ['/login','/register','/forgot','/quiz-take'];
function render(){
  const hash = window.location.hash.replace('#','') || (currentUser() ? '/dashboard' : '/login');
  const user = currentUser();
  const basePath = hash.split('?')[0];

  if(basePath==='/quiz-take'){
    const app = document.getElementById('app');
    app.innerHTML = quizTakeView(hash.split('?')[1]);
    bindQuizTakeHandlers(hash.split('?')[1]);
    return;
  }

  if(!user && !PUBLIC_PATHS.includes(basePath)){
    go('/login'); return;
  }
  if(user && ['/login','/register','/forgot'].includes(hash)){ go('/dashboard'); return; }

  const [path, param] = hash.split('?');
  const app = document.getElementById('app');

  if(path==='/login') return renderAuthShell(loginView());
  if(path==='/register') return renderAuthShell(registerView());
  if(path==='/forgot') return renderAuthShell(forgotView());

  const isStudent = user && user.role === 'student';

  // authenticated app shell
  let body = '';
  if(path==='/dashboard') body = isStudent ? studentDashboardView() : dashboardView();
  else if(path==='/create-manual') body = createManualView(param);
  else if(path==='/generate-ai') body = generateAiView();
  else if(path==='/upload-ppt') body = uploadPptView();
  else if(path==='/ai-review') body = aiReviewView();
  else if(path==='/my-quizzes') body = myQuizzesView();
  else if(path==='/quiz-submissions') body = isStudent ? studentDashboardView() : quizSubmissionsView(param);
  else if(path==='/quiz-play') body = quizPlayView(param);
  else if(path==='/quiz-results') body = quizResultsView();
  else if(path==='/quiz-review') body = quizReviewView(param);
  else if(path==='/flashcards') body = flashcardsListView();
  else if(path==='/flashcards-study') body = flashcardsStudyView(param);
  else if(path==='/history') body = historyView();
  else if(path==='/profile') body = profileView();
  else if(path==='/settings') body = settingsView();
  else if(path==='/guide') body = guideView();
  else body = isStudent ? studentDashboardView() : dashboardView();

  if(!isStudent && CREATE_PATHS.includes(path)) body = createTabs(path) + body;
  app.innerHTML = appShell(path, body);
  bindGlobalHandlers();
  bindPageHandlers(param ? path + '?' + param : path);
}

function renderAuthShell(inner){
  document.getElementById('app').innerHTML = `<div class="auth-shell auth-bg">
    <div class="auth-form-side">${inner}</div>
  </div>`;
  bindAuthHandlers();
}

function loginView(){
  return `<div class="auth-card">
    ${brandHtml()}

function bindAuthHandlers(){

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = document.getElementById(btn.dataset.toggle);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    });
  });
const createAccountBtn = document.getElementById('createAccountBtn');
if(createAccountBtn) createAccountBtn.addEventListener('click', ()=> go('/register'));
  const backToLoginBtn = document.getElementById('backToLoginBtn');
if(backToLoginBtn) backToLoginBtn.addEventListener('click', ()=> go('/login'));

  /* ---- Role selector: Register (Teacher Account / Student Account) ---- */
  window.__selectedRegisterRole = window.__selectedRegisterRole || null;
  const roleTeacherBtn = document.getElementById('roleTeacherBtn');
  const roleStudentBtn = document.getElementById('roleStudentBtn');
  if(roleTeacherBtn && roleStudentBtn){
    const setRole = (role)=>{
      window.__selectedRegisterRole = role;
      roleTeacherBtn.classList.toggle('selected', role==='teacher');
      roleStudentBtn.classList.toggle('selected', role==='student');
    };
    roleTeacherBtn.addEventListener('click', ()=> setRole('teacher'));
    roleStudentBtn.addEventListener('click', ()=> setRole('student'));
  }

  /* ---- Role selector: Login (Teacher Login / Student Login) ---- */
  window.__selectedLoginRole = window.__selectedLoginRole || 'teacher';
  const loginRoleTeacherBtn = document.getElementById('loginRoleTeacherBtn');
  const loginRoleStudentBtn = document.getElementById('loginRoleStudentBtn');
  if(loginRoleTeacherBtn && loginRoleStudentBtn){
    const setLoginRole = (role)=>{
      window.__selectedLoginRole = role;
      loginRoleTeacherBtn.classList.toggle('selected', role==='teacher');
      loginRoleStudentBtn.classList.toggle('selected', role==='student');
    };
    loginRoleTeacherBtn.addEventListener('click', ()=> setLoginRole('teacher'));
    loginRoleStudentBtn.addEventListener('click', ()=> setLoginRole('student'));
    setLoginRole(window.__selectedLoginRole);
  }

  /* ================= LOGIN ================= */

  const lf = document.getElementById('loginForm');

  if(lf) lf.addEventListener('submit', async e=>{
    e.preventDefault();

    const identifier = document
      .getElementById('li_user')
      .value
      .trim()
      .toLowerCase();

    const pass = document.getElementById('li_pass').value;
    const msg = document.getElementById('authMsg');

    msg.innerHTML = `<div class="ok-msg">Logging in...</div>`;

    try{

      let email = identifier;

      /* Login using username */
      if(!identifier.includes('@')){

        const q = query(
          collection(firestore, 'users'),
          where('usernameLower', '==', identifier)
        );

        const snapshot = await getDocs(q);

        if(snapshot.empty){
          msg.innerHTML =
            `<div class="err-msg">Username not found.</div>`;
          return;
        }

        email = snapshot.docs[0].data().email;
      }

      const credential =
        await signInWithEmailAndPassword(auth, email, pass);

      const user = credential.user;

      /* Verify the account's registered role matches the login tab chosen */
      const profileSnap = await getDoc(doc(firestore, 'users', user.uid));
      const profileData = profileSnap.exists() ? profileSnap.data() : null;
      const accountRole = profileData && profileData.role ? profileData.role : 'teacher';
      const chosenRole = window.__selectedLoginRole || 'teacher';

      if(accountRole !== chosenRole){
        await signOut(auth);
        const roleLabel = accountRole === 'teacher' ? 'Teacher Login' : 'Student Login';
        msg.innerHTML =
          `<div class="err-msg">This account is registered as a ${accountRole==='teacher'?'Teacher':'Student'}. Please use ${roleLabel} instead.</div>`;
        return;
      }

      localStorage.setItem('fq_firebase_uid', user.uid);
      localStorage.setItem('fq_firebase_profile', JSON.stringify(profileData||{}));

      msg.innerHTML = '';

      toast('Welcome back!');

      go('/dashboard');

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">Incorrect username/email or password.</div>`;
    }

  });


  /* ================= REGISTER ================= */

  const rf = document.getElementById('registerForm');

  if(rf) rf.addEventListener('submit', async e=>{
    e.preventDefault();

    const name =
      document.getElementById('r_name').value.trim();

    const username =
      document.getElementById('r_user').value.trim();

    const email =
      document.getElementById('r_email').value.trim().toLowerCase();

    const pass =
      document.getElementById('r_pass').value;

    const pass2 =
      document.getElementById('r_pass2').value;

    const msg =
      document.getElementById('authMsg');

    if(pass !== pass2){
      msg.innerHTML =
        `<div class="err-msg">Passwords do not match.</div>`;
      return;
    }

    if(pass.length < 6){
      msg.innerHTML =
        `<div class="err-msg">Password must be at least 6 characters.</div>`;
      return;
    }

    if(username.length < 3){
      msg.innerHTML =
        `<div class="err-msg">Username must be at least 3 characters.</div>`;
      return;
    }

    const role = window.__selectedRegisterRole;
    if(role !== 'teacher' && role !== 'student'){
      msg.innerHTML =
        `<div class="err-msg">Please choose a Teacher Account or a Student Account.</div>`;
      return;
    }

    msg.innerHTML =
      `<div class="ok-msg">Creating account...</div>`;

    const explain = (error, fallback)=>{
      const code = (error && error.code) || '';
      const map = {
        'auth/email-already-in-use': 'Email is already registered.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/weak-password': 'Password is too weak.',
        'auth/operation-not-allowed': 'Email/Password sign-in is not enabled in Firebase (Authentication → Sign-in method).',
        'auth/unauthorized-domain': 'This website address is not authorized in Firebase (Authentication → Settings → Authorized domains).',
        'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'permission-denied': 'Firestore rules are blocking account creation. Publish the rules from firestore.rules.',
        'unavailable': 'Cannot reach the database. Check your internet connection and try again.'
      };
      const base = map[code] || fallback;
      return code && !map[code] ? `${base} (${code})` : base;
    };

    let user = null;

    try{

      /* Best-effort username check. This runs before login, so if Firestore
         rules don't allow it we skip it instead of blocking sign-up. */

      try{
        const usernameQuery = query(
          collection(firestore, 'users'),
          where('usernameLower', '==', username.toLowerCase())
        );

        const usernameSnapshot =
          await getDocs(usernameQuery);

        if(!usernameSnapshot.empty){
          msg.innerHTML =
            `<div class="err-msg">Username already taken.</div>`;
          return;
        }
      }catch(checkErr){
        console.warn('Username check skipped:', checkErr);
      }

      /* Create Firebase Authentication account */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          pass
        );

      user = credential.user;

      /* Save profile in Firestore */

      const createdAt = new Date().toISOString();

      const profile = {
        uid: user.uid,
        name: name,
        username: username,
        usernameLower: username.toLowerCase(),
        email: email,
        role: role,
        createdAt: createdAt
      };

      try{
        await setDoc(doc(firestore, 'users', user.uid), profile);
      }catch(profileErr){
        /* Roll back the auth account so the person can simply try again
           instead of getting "Email is already registered". */
        console.error('Profile save failed:', profileErr);
        try{ await deleteUser(user); }catch(delErr){ console.error(delErr); try{ await signOut(auth); }catch(e){} }
        msg.innerHTML =
          `<div class="err-msg">${explain(profileErr, 'Could not save your profile.')}</div>`;
        return;
      }

      localStorage.setItem('fq_firebase_uid', user.uid);
      localStorage.setItem('fq_firebase_profile', JSON.stringify(profile));

      msg.innerHTML = '';

      toast('Account created! Welcome to Flashcard Quiz.');

      go('/dashboard');

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">${explain(error, 'Unable to create account.')}</div>`;
    }

  });


  /* ================= FORGOT PASSWORD ================= */

  const ff = document.getElementById('forgotForm');

  if(ff) ff.addEventListener('submit', async e=>{
    e.preventDefault();

    const email =
      document.getElementById('f_email')
      .value
      .trim()
      .toLowerCase();

    const msg =
      document.getElementById('authMsg');

    const btn =
      document.getElementById('forgotBtn');

    try{

      await sendPasswordResetEmail(
        auth,
        email
      );

      msg.innerHTML =
        `<div class="ok-msg">
          Password reset link sent to your email.
        </div>`;

      btn.textContent = 'Reset Email Sent';

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">
          Unable to send reset email. Check the email address.
        </div>`;
    }

  });
}

  };
  tick(); clockTimer = setInterval(tick, 1000);

function dashboardView(){
  const u = currentUser();
  const teacher = !isStudentUser();
  const quizzes = myQuizzes();
  const hist = myHistory();
  const totalQuizzes = quizzes.length;
  const totalQuestions = quizzes.reduce((s,q)=> s+q.questions.length, 0);

  let recentActivityHtml, completed, avgScore;
  if(teacher){
    // Teachers don't take their own quizzes, so "Recent activity" shows
    // recent STUDENT SUBMISSIONS across all their quizzes instead. Clicking
    // a row opens that quiz's Submissions page so the teacher can see who
    // answered and how.
    window.__recentSubsCache = window.__recentSubsCache || {};
    let subsState = window.__recentSubsCache[u.id];
    if(subsState === undefined){
      window.__recentSubsCache[u.id] = 'loading';
      loadRecentSubmissions(u.id, quizzes.map(q=>q.id));
      subsState = 'loading';
    }
    const subsArr = Array.isArray(subsState) ? subsState : [];
    completed = subsArr.length;
    avgScore = subsArr.length ? Math.round(subsArr.reduce((s,x)=>s+x.percentage,0)/subsArr.length) : 0;
    if(subsState === 'loading'){
      recentActivityHtml = `<div class="empty-card"><div class="icon">⏳</div><p>Loading recent activity…</p></div>`;
    } else if(subsState === 'error'){
      recentActivityHtml = `<div class="empty-card"><div class="icon">⚠️</div><p>Could not load recent activity.</p></div>`;
    } else if(!subsArr.length){
      recentActivityHtml = `<div class="empty-card"><div class="icon">🕒</div><p>No submissions yet. Share a quiz to get started!</p></div>`;
    } else {
      // Group by quiz so each quiz shows only ONCE (the most recent
      // submission), with a "+N more" badge if several students answered.
      // The teacher still sees every student by clicking through to
      // that quiz's Submissions page.
      const latestByQuiz = new Map(), countByQuiz = new Map();
      subsArr.forEach(s=>{
        countByQuiz.set(s.quizId, (countByQuiz.get(s.quizId)||0)+1);
        const cur = latestByQuiz.get(s.quizId);
        if(!cur || new Date(s.submittedAt) > new Date(cur.submittedAt)) latestByQuiz.set(s.quizId, s);
      });
      const grouped = [...latestByQuiz.values()].sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt));
      recentActivityHtml = `<table><tr><th>Quiz</th><th>Student</th><th>Score</th><th></th></tr>
        ${grouped.slice(0,5).map(s=>{ const n = countByQuiz.get(s.quizId); return `<tr class="clickable-row" data-nav="/quiz-submissions?${s.quizId}" style="cursor:pointer;">
          <td>${escapeHtml(s.quizTitle||'')}</td>
          <td>${escapeHtml(s.studentName||'')}${n>1 ? ` <span class="tag tag-blue" style="margin-left:4px;">+${n-1} more</span>` : ''}</td>
          <td><span class="tag ${s.percentage>=70?'tag-easy':s.percentage>=50?'tag-medium':'tag-hard'}">${s.percentage}%</span></td>
          <td style="text-align:right;color:var(--muted);">›</td>
        </tr>`; }).join('')}
      </table>`;
    }
  } else {
    completed = hist.length;
    avgScore = completed ? Math.round(hist.reduce((s,h)=> s+h.percentage,0)/completed) : 0;
    const recent = hist.slice(0,5);
    recentActivityHtml = recent.length ? `<table><tr><th>Quiz</th><th>Date</th><th>Score</th></tr>
        ${recent.map(h=>`<tr><td>${escapeHtml(h.quizTitle)}</td><td>${fmtDate(h.date)}</td><td><span class="tag ${h.percentage>=70?'tag-easy':h.percentage>=50?'tag-medium':'tag-hard'}">${h.percentage}%</span></td></tr>`).join('')}
      </table>` : `<div class="empty-card"><div class="icon">🕒</div><p>No attempts yet. Take a quiz!</p></div>`;
  }
  return `
  ${heroHtml(u, 'Keep learning, one quiz at a time!')}
  <div class="grid grid-4" style="margin-bottom:26px;">
    ${statCard(totalQuizzes, 'QUIZZES', '#ece9fe', '#151a2d')}
    ${statCard(totalQuestions, 'QUESTIONS', '#fbbf24', '#151a2d')}
    ${statCard(completed, teacher?'STUDENT SUBMISSIONS':'COMPLETED', '#22c55e', '#0b3d1f')}
    ${statCard(avgScore+'%', 'AVERAGE SCORE', '#ec4899', '#3d0b23')}
  </div>
  <div class="section-title">Start something</div>
  <div class="grid grid-4" style="margin-bottom:26px;">
    <div class="action-tile tile-blue" data-nav="/upload-ppt"><div class="icon">📤</div><b>Upload PPT</b><span>Turn your slides into a quiz!</span></div>
    <div class="action-tile tile-yellow" data-nav="/generate-ai"><div class="icon">✨</div><b>Generate with AI</b><span>Pick a topic &amp; count</span></div>
    <div class="action-tile tile-green" data-nav="/create-manual"><div class="icon">✏️</div><b>Create manually</b><span>Write your own</span></div>
    <div class="action-tile tile-purple" data-nav="/flashcards"><div class="icon">📁</div><b>Flashcards</b><span>Flip & memorize</span></div>
  </div>
  <div class="card pad" style="margin-bottom:26px;">
    <div class="card-h"><span>🗒️</span>Recent activity</div>
    ${recentActivityHtml}
  </div>
  <div style="margin-top:18px;">${savedSummariesCard(false)}</div>
  `;
}
/* Fetches every submission across a teacher's quizzes (one query per quiz),
   newest first, and caches the result on window so dashboardView() can
   render synchronously on re-render. */
async function loadRecentSubmissions(cacheKey, quizIds){
  try{
    if(!quizIds.length){ window.__recentSubsCache[cacheKey] = []; render(); return; }
    const results = await Promise.all(quizIds.map(async id=>{
      try{
        const snap = await getDocs(collection(firestore, 'publicQuizzes', id, 'submissions'));
        return snap.docs.map(d=>d.data());
      }catch(e){ return []; }
    }));
    window.__recentSubsCache[cacheKey] = results.flat().sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt));
  }catch(e){
    console.error('Load recent submissions error:', e);
    window.__recentSubsCache[cacheKey] = 'error';
  }
  render();
}

    ${list.length ? `<div class="wrap-x"><table><tr><th>Title</th><th>Saved</th><th>Topics</th><th></th></tr>
      ${list.map(s=>`<tr><td><b>📄 ${escapeHtml(s.title)}</b></td><td>${fmtDate(s.createdAt)}</td><td>${(s.topics&&s.topics.length)||1}</td><td style="text-align:right;white-space:nowrap;"><button class="pill-btn" onclick="openSummaryModal('${s.id}')">👁 View</button></td></tr>`).join('')}
    </table></div>` : `<div class="empty-card"><div class="icon">📝</div><p>No saved summaries yet. Upload a PPT in AI Summarize/Review to make one.</p></div>`}
  </div>`;
}
function statCard(num, lbl){
  const m = {'QUIZZES':['📋','#e3eeff'],'MY QUIZZES':['📋','#e3eeff'],'QUESTIONS':['❓','#fff3cf'],'COMPLETED':['✅','#dcf5e6'],'STUDENT SUBMISSIONS':['🧑‍🎓','#dcf5e6'],'AVERAGE SCORE':['⭐','#ffe3ef']}[lbl] || ['📋','#e3eeff'];
  return `<div class="card stat2"><div class="ic" style="background:${m[1]}">${m[0]}</div><div><div class="n">${num}</div><div class="l">${lbl}</div></div></div>`;
}

function bindGenerateAiHandlers(){
  bindShsFields('ai');
  document.getElementById('genAiBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('ai_title').value.trim() || 'Untitled AI Quiz';
    const topicInput = document.getElementById('ai_topic');
    const diff = document.getElementById('ai_diff').value;
    const count = Math.max(1, parseInt(document.getElementById('ai_count').value)||5);
    const notes = document.getElementById('ai_notes').value.trim();
    const strand = document.getElementById('ai_strand').value, subjectName = document.getElementById('ai_subject').value;
    const status = document.getElementById('aiStatus');
    // If no topic was typed, fall back to the selected Subject instead of
    // silently doing nothing — most teachers leave this blank and expect
    // the already-selected Subject to be used.
    let topic = topicInput.value.trim();
    if(!topic && subjectName && subjectName !== 'Other') topic = subjectName;
    if(!topic){
      topicInput.style.borderColor = 'var(--danger)';
      status.style.color = 'var(--danger)';
      status.style.fontWeight = '700';
      status.textContent = '⚠️ Please enter a topic (e.g. "Photosynthesis") so the AI knows what to write about.';
      topicInput.focus();
      topicInput.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Please enter a topic first.');
      return;
    }
    topicInput.style.borderColor = '';
    status.style.fontWeight = '';
    status.style.color = '';
    status.textContent = 'Generating and fact-checking questions with AI…';
    document.getElementById('genAiBtn').disabled = true;
    const fallbackContext = [topic + '. ' + (notes||'') + '. ' + topic + ' is an important subject with many key ideas, terms, and concepts to understand.'];
    let questions = null;
    try{ questions = await aiGenerateQuiz(notes, topic, count, diff, { mode:'topic', strand, subject:subjectName }); }catch(err){ console.error('AI quiz error:', err); }
    let source = 'ai';
    if(!questions || !questions.length){
      status.textContent = `AI isn't connected (Settings, then AI connection), so the basic generator made ${count} questions instead.`;
      questions = ruleBasedQuiz(fallbackContext, count, diff);
      source = 'fallback';
    } else {
      const gotCount = questions.length;
      questions = ensureCount(questions, fallbackContext, count, diff);
      status.textContent = gotCount < count
        ? `AI returned ${gotCount} — topped up to ${questions.length} questions as requested.`
        : `Generated ${questions.length} questions with AI.`;
    }
    document.getElementById('genAiBtn').disabled = false;
    window.__pendingAiQuiz = { title: (title==='Untitled AI Quiz' ? topic+' Quiz' : title), subject: topic, strand, subjectName, difficulty: diff, questions, source };
    document.getElementById('aiResultWrap').innerHTML = `
      <div class="card pad">
        <div class="section-title">Generated Questions (${questions.length})</div>
        ${questions.map((q,i)=>`<div class="q-card"><b>${i+1}. ${escapeHtml(q.text)}</b>
          ${q.options.map((o,idx)=>`<div class="quiz-opt ${idx===q.answerIndex?'correct':''}" style="cursor:default;"><span class="opt-letter">${String.fromCharCode(65+idx)}</span>${escapeHtml(o)}</div>`).join('')}
        </div>`).join('')}
        <button class="btn btn-primary" id="saveAiQuizBtn">💾 Save Quiz</button>
      </div>`;
    document.getElementById('saveAiQuizBtn').addEventListener('click', async (e)=>{
      const u = currentUser();
      const data = window.__pendingAiQuiz;
      e.target.disabled = true; e.target.textContent = 'Saving…';
      await addQuizDoc({ id:uid('quiz'), ownerId:u.id, title:data.title, subject:data.subjectName||'AI Generated', strand:data.strand||'', description:`Auto-generated quiz about "${data.subject}"`, difficulty:data.difficulty, questions:data.questions, createdAt: nowISO(), source:'ai' });
      toast('Quiz saved!');
      go('/my-quizzes');
    });
  });
}

function bindUploadPptHandlers(){
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('pptInput');
  document.getElementById('chooseFileBtn').addEventListener('click', ()=> input.click());
  dz.addEventListener('click', (e)=>{ if(e.target.id==='dropzone') input.click(); });
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{ if(e.dataTransfer.files.length) handlePptFile(e.dataTransfer.files[0]); });
  input.addEventListener('change', e=>{ if(e.target.files.length) handlePptFile(e.target.files[0]); });
}
async function handlePptFile(file){
  if(!/\.pptx$/i.test(file.name)){
    toast('Please upload a .pptx file.');
    return;
  }

  const u = currentUser();

  if(!u){
    toast('Please log in before uploading a PowerPoint file.');
    return;
  }

  pptFileName = file.name;
  pptFileUrl = null;

  const infoWrap = document.getElementById('fileInfoWrap');

  if(!infoWrap){
    console.error('fileInfoWrap element not found.');
    toast('Upload area is unavailable. Please refresh the page.');
    return;
  }

  infoWrap.innerHTML = `
    <div class="card pad" style="margin-top:16px;background:var(--surface-2);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="font-size:20px;">📄</span>
          <div>
            <b style="font-size:13.5px;">${escapeHtml(file.name)}</b>
            <div style="font-size:12px;color:var(--muted);">
              ${(file.size/1024/1024).toFixed(2)} MB
            </div>
          </div>
        </div>
        <span id="pptStatusIcon">⏳</span>
      </div>

      <div class="progress-bar">
        <div id="pptProgress" style="width:10%"></div>
      </div>

      <p id="pptStatusText"
         style="font-size:12.5px;color:var(--muted);margin-top:8px;">
        Reading slides…
      </p>
      <p id="pptUploadNote" style="font-size:11.5px;color:var(--muted);margin-top:4px;"></p>
    </div>
  `;

  try{

    /* =====================================================
       STEP 1 — UPLOAD ORIGINAL PPT TO FIREBASE STORAGE
       ===================================================== */

    if(typeof window.__uploadPptToStorage !== 'function'){
      throw new Error('Firebase Storage upload function is not available.');
    }

    /* The Storage upload runs in the BACKGROUND. It no longer blocks reading the
       slides / generating the quiz, so a slow or misconfigured Storage can't freeze
       the page at 0%. */
    const setNote = (t, color)=>{ const n = document.getElementById('pptUploadNote'); if(n){ n.textContent = t; n.style.color = color || 'var(--muted)'; } };
    /* Set to true only if you enable Firebase Storage (needs the paid Blaze plan). */
    const ENABLE_PPT_BACKUP = false;
    if(ENABLE_PPT_BACKUP){
    setNote('☁️ Backing up original file… 0%');
    Promise.race([
      window.__uploadPptToStorage(file, progress => {
        setNote('☁️ Backing up original file… ' + progress + '%');
      }),
      new Promise((_, rej)=> setTimeout(()=> rej(new Error('Storage upload timed out')), 120000))
    ]).then(url=>{
      pptFileUrl = url;
      if(window.__pendingPptQuiz) window.__pendingPptQuiz.pptFileUrl = url;
      setNote('✅ Original file backed up to your account.', 'var(--success)');
    }).catch(err=>{
      console.error('PPT Storage upload failed (quiz can still be created):', err);
      const code = (err && (err.code || err.message)) || 'unknown';
      setNote('⚠️ Original file was not backed up (' + code + '). You can still create the quiz.', 'var(--danger)');
    });
    }

    const progressBar = document.getElementById('pptProgress');
    const statusText = document.getElementById('pptStatusText');
    if(progressBar) progressBar.style.width = '30%';
    if(statusText) statusText.textContent = 'Reading slides…';

    const extractedSlides = await extractPptxText(file);


    /* =====================================================
       STEP 4 — SAVE EXTRACTED SLIDES
       ===================================================== */

    pptSlides = extractedSlides || [];

    document.getElementById('pptProgress').style.width = '100%';

    const statusIcon = document.getElementById('pptStatusIcon');

    if(statusIcon) statusIcon.textContent = '✅';

    if(statusText){
      statusText.textContent =
        `Extracted text from ${pptSlides.length} slide(s). You can generate the quiz now.`;
    }

    if(!pptSlides.length){
      if(statusText){
        statusText.textContent =
          'No readable text was found in this file.';
      }
      toast('No readable text was found in this PPT.');
      return;
    }

    /* =====================================================
       STEP 5 — SHOW QUIZ OPTIONS ONLY AFTER PPT IS SAVED
       ===================================================== */

    const optionsWrap = document.getElementById('pptOptionsWrap');

    if(!optionsWrap){
      throw new Error('pptOptionsWrap element not found.');
    }

    optionsWrap.innerHTML = `
      <div style="margin-top:18px;">

        <div class="form-row">

          <div class="field">
            <label>Number of Questions</label>
            <input
              id="ppt_count"
              type="number"
              min="1"
              value="10">
          </div>

          <div class="field">
            <label>Difficulty Level</label>
            <select id="ppt_diff">
              <option>Easy</option>
              <option selected>Medium</option>
              <option>Hard</option>
            </select>
          </div>

        </div>

        <p style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">
          Your PowerPoint is already saved to your account.
          The quiz will be linked to this uploaded file.
        </p>

        <button class="btn btn-primary" id="genFromPptBtn">
          Generate Questions
        </button>

      </div>

      <div id="pptResultWrap" style="margin-top:16px;"></div>
    `;


    /* =====================================================
       STEP 6 — GENERATE QUESTIONS
       ===================================================== */

    document.getElementById('genFromPptBtn').addEventListener('click', async ()=>{

      const count = Math.max(
        1,
        parseInt(document.getElementById('ppt_count').value) || 10
      );

      const diff = document.getElementById('ppt_diff').value;

      const btn = document.getElementById('genFromPptBtn');

      btn.disabled = true;
      btn.textContent = 'Generating…';

      try{

        const combined = pptSlides.join('\n');
        const metaPromise = detectPptSubject(combined);

        let questions = await aiGenerateQuiz(combined, pptFileName, count, diff, { mode:'ppt' });

        let source = 'ai';

        if(!questions || !questions.length){

          questions = ruleBasedQuiz(
            pptSlides,
            count,
            diff
          );

          source = 'fallback';

        }else{

          questions = ensureCount(
            questions,
            pptSlides,
            count,
            diff
          );

        }

        const pptMeta = await metaPromise;
        window.__pendingPptQuiz = {
          title:
            pptFileName.replace(/\.pptx$/i,''),

          questions,
          source,

          /* IMPORTANT:
             Keep the Firebase Storage URL with the pending quiz.
          */
          pptFileName: pptFileName,
          pptFileUrl: pptFileUrl,
          strand: pptMeta.strand,
          subjectName: pptMeta.subject
        };

        document.getElementById('pptResultWrap').innerHTML = `
          <div class="card pad">

            <div class="section-title">
              Generated Questions (${questions.length})
              ${
                source === 'fallback'
                ? '<span class="tag tag-medium">auto</span>'
                : '<span class="tag tag-blue">AI</span>'
              }
            </div>

            ${questions.map((q,i)=>`

              <div class="q-card">

                <b>
                  ${i+1}. ${escapeHtml(q.text)}
                </b>

                ${q.options.map((o,idx)=>`

                  <div
                    class="quiz-opt ${idx===q.answerIndex?'correct':''}"
                    style="cursor:default;"
                  >
                    <span class="opt-letter">
                      ${String.fromCharCode(65+idx)}
                    </span>

                    ${escapeHtml(o)}
                  </div>

                `).join('')}

              </div>

            `).join('')}

            <button class="btn btn-primary" id="savePptQuizBtn">
              💾 Save Quiz
            </button>

          </div>
        `;

        /* =================================================
           STEP 7 — SAVE QUIZ TO FIRESTORE
           ================================================= */

        document
          .getElementById('savePptQuizBtn')
          .addEventListener('click', async (e)=>{

            const user = currentUser();

            if(!user){
              toast('Please log in again.');
              return;
            }

            const data = window.__pendingPptQuiz;

            if(!data || !data.questions || !data.questions.length){
              toast('No generated questions to save.');
              return;
            }

            /* Final safety check:
               Do not save quiz without the PPT URL.
            */

            e.target.disabled = true;
            e.target.textContent = 'Saving…';

            try{

              await addQuizDoc({

                id: uid('quiz'),

                ownerId: user.id,

                title: data.title,

                subject: data.subjectName || 'From PowerPoint',

                strand: data.strand || '',

                description:
                  `Generated from ${data.pptFileName}`,

                difficulty: diff,

                questions: data.questions,

                createdAt: nowISO(),

                source: 'ppt',

                /* Firebase Storage information */
                pptFileName: data.pptFileName,

                pptFileUrl: data.pptFileUrl || pptFileUrl || null

              });

              toast('Quiz saved to your account!');

              go('/my-quizzes');

            }catch(saveError){

              console.error(
                'Save PPT quiz error:',
                saveError
              );

              toast(
                'Could not save the quiz to your account.'
              );

              e.target.disabled = false;
              e.target.textContent = '💾 Save Quiz';

            }

          });

      }catch(generateError){

        console.error(
          'PPT quiz generation error:',
          generateError
        );

        toast(
          'Could not generate questions. Please try again.'
        );

      }finally{

        btn.disabled = false;
        btn.textContent = 'Generate Questions';

      }

    });

  }catch(e){

    console.error(
      'PPT upload/read error:',
      e
    );

    pptFileUrl = null;

    const icon = document.getElementById('pptStatusIcon');
    const text = document.getElementById('pptStatusText');

    if(icon) icon.textContent = '❌';

    if(text){
      text.textContent =
        'Could not save/read this PowerPoint. Please try again.';
    }

    toast(
      'PowerPoint upload failed. The quiz was not created.'
    );

  }
      }

function splitTopics(text){
  if(/^Slide \d+:/.test(text.trim())){
    const parts = text.trim().split(/\n\s*\n(?=Slide \d+:)/).map(s=>s.replace(/^Slide \d+:\s*/,'').trim()).filter(Boolean);
    if(parts.length) return parts;
  }
  const paras = text.split(/\n\s*\n/).map(s=>s.trim()).filter(s=>s.length>20);
  if(paras.length>1) return paras.slice(0,12);
  const sents = text.split(/(?<=[.!?])\s+/).filter(s=>s.length>20), out = [];
  for(let i=0;i<sents.length;i+=3) out.push(sents.slice(i,i+3).join(' '));
  return out.slice(0,10);
}
async function aiSummarize(text){
  const sampler = await getSampler();
  const fallback = ()=>{
    const topics = splitTopics(text).map(chunk=>{
      const sents = chunk.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
      const words = chunk.split(/\s+/);
      return { topic: words.slice(0,6).join(' ') + (words.length>6 ? '…' : ''), summary: sents.slice(0,2).join(' ') || chunk.slice(0,220), points: sents.slice(0,3).map(s=>s.length>140 ? s.slice(0,137)+'…' : s) };
    });
    return { overview: '', topics: topics.length ? topics : [{topic:'Summary', summary:text.slice(0,300), points:[]}] };
  };
  if(!sampler) return { ...fallback(), source:'fallback' };
  const prompt = `Summarize the following study material topic by topic (one topic per main idea or group of slides). Use 3 to 10 topics, short and student-friendly.
Respond with ONLY raw JSON (no markdown fences): {"overview":"1-2 sentence overview","topics":[{"topic":"short topic name","summary":"1-3 sentence summary","points":["key point","key point"]}]}

MATERIAL:
"""${(text||'').slice(0,12000)}"""`;
  try{
    const res = await sampler(prompt, { modelTier:'default' });
    let txt = (res && res.text) ? res.text.trim() : '';
    txt = txt.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const jsonMatch = txt.match(/\{[\s\S]*\}/);
    const obj = JSON.parse(jsonMatch ? jsonMatch[0] : txt);
    if(!Array.isArray(obj.topics) || !obj.topics.length) throw new Error('bad shape');
    obj.topics = obj.topics.map(t=>({ topic:String(t.topic||'Topic'), summary:String(t.summary||''), points:Array.isArray(t.points)?t.points.map(String):[] }));
    return { overview:String(obj.overview||''), topics:obj.topics, source:'ai' };
  }catch(e){
    return { ...fallback(), source:'fallback' };
  }
}
function summaryTableHtml(s){
  const topics = (s.topics && s.topics.length) ? s.topics : [{topic:'Summary', summary:s.summary||'', points:s.points||[]}];
  return `${s.overview ? `<p class="sum-ov">${escapeHtml(s.overview)}</p>` : ''}
  <div class="wrap-x"><table class="sum-table"><thead><tr><th>#</th><th>Topic</th><th>Summary</th><th>Key points</th></tr></thead><tbody>
    ${topics.map((t,i)=>`<tr><td data-l="No.">${i+1}</td><td data-l="Topic"><b>${escapeHtml(t.topic)}</b></td><td data-l="Summary">${escapeHtml(t.summary)}</td><td data-l="Key points"><ul>${(t.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul></td></tr>`).join('')}
  </tbody></table></div>`;
}

      const code = window.__lastPublishError || '';
      const why = /permission/i.test(code) ? 'Firestore rules are blocking it — publish the rules from firestore.rules.'
        : /not-signed-in/.test(code) ? 'You are signed out — log in again.'
        : /unavailable|network|offline/i.test(code) ? 'Cannot reach Firestore — try mobile data or another Wi-Fi.'
        : /not-found/i.test(code) ? 'Firestore Database is not created yet in Firebase Console.'
        : 'Error: '+code;
      setShareStatus('err','⚠️ Link not published. '+why);
    }
    return ok === true;
  }catch(e){
    setShareStatus('err','⚠️ Cannot reach Firestore (timed out). Not a Wi-Fi speed problem — see the test result below.');
    diagnoseFirestore();
    return false;
  }
}

function loadScriptTag(src){
  return new Promise((res, rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t); });
}
async function ensureQrLib(){
  if(typeof QRCode !== 'undefined') return true;
  for(const src of ['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js']){
    try{ await loadScriptTag(src); if(typeof QRCode !== 'undefined') return true; }catch(e){}
  }
  return false;
}
/* Renders the QR code, then composites it onto a canvas with the shareable
   link printed in small text underneath, so the single downloaded image
   contains BOTH the QR code and the readable link. */
async function buildQrComposite(link, title){
  window.__qrBlob = null;
  const fail = ()=>{ const m=document.getElementById('qrLoadingMsg'); if(m){ m.style.color='var(--danger)'; m.textContent='QR code could not be generated. Use the link below instead.'; } };
  if(!(await ensureQrLib())) return fail();
  const target = document.getElementById('qrRenderTarget');
  if(!target) return;
  target.innerHTML = '';
  /* High-resolution QR (560px) with a wide white border so the saved picture
     is sharp and scans easily from a phone or a printed page. */
  const size = 560, pad = 48, titleH = 52, textH = 116;
  try{ new QRCode(target, { text: link, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ console.error('QR error:', e); return fail(); }
  setTimeout(()=>{
    const qrCanvas = target.querySelector('canvas');
    const qrImg = target.querySelector('img');
    const canvas = document.createElement('canvas');
    canvas.width = size + pad*2;
    canvas.height = size + pad*2 + textH + titleH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#151a2d';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(title.length>34 ? title.slice(0,34)+'…' : title, canvas.width/2, pad+4);
    const finish = ()=>{
      ctx.fillStyle = '#6b7280';
      ctx.font = '22px Arial';
      wrapCanvasText(ctx, link, canvas.width/2, pad + titleH + size + 44, canvas.width-48, 26);
      const finalUrl = canvas.toDataURL('image/png');
      const img = document.getElementById('qrFinalImg'), msg = document.getElementById('qrLoadingMsg');
      if(!img) return;
      img.src = finalUrl; img.style.display = 'block';
      const hint = document.getElementById('qrHint'); if(hint) hint.style.display = 'block';
      if(msg) msg.remove();
      canvas.toBlob(b=>{ window.__qrBlob = b; }, 'image/png');
    };
    if(qrCanvas && qrCanvas.width){ ctx.drawImage(qrCanvas, pad, pad+titleH, size, size); finish(); }
    else if(qrImg && qrImg.src){
      const im = new Image();
      im.onload = ()=>{ ctx.drawImage(im, pad, pad+titleH, size, size); finish(); };
      im.onerror = fail;
      im.src = qrImg.src;
    } else fail();
  }, 80);
}

/* Saves the QR picture to the device. Uses a real file (blob) instead of a
   data-URL link, which many phone browsers refuse to download. */
async function downloadQrImage(fileName){
  const blob = window.__qrBlob;
  if(!blob){ toast('QR code is still generating. Try again in a moment.'); return; }
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const inApp = /FBAN|FBAV|Instagram|Line\/|Messenger|MicroMessenger/i.test(ua);
  const file = new File([blob], fileName, { type:'image/png' });
  const url = URL.createObjectURL(blob);
  /* iPhone/iPad: open the share sheet, then tap "Save Image" */
  if(isIOS && navigator.canShare && navigator.canShare({ files:[file] })){
    try{ toast('Tap "Save Image" to add it to your Photos.'); await navigator.share({ files:[file], title:fileName }); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  /* In-app browsers (Facebook, Messenger…) block downloads: show the image to save */
  if(inApp){
    window.open(url, '_blank');
    toast('Press and hold the QR picture, then choose Save Image.');
    return;
  }
  const a = document.createElement('a');
  a.href = url; a.download = fileName; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
  toast(/Android/i.test(ua) ? 'Saved! Open Gallery and look in the "Download" album.' : 'QR code downloaded.');
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split('');
  let line = '', lines = [];
  for(const ch of words){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = ch; }
    else line = test;
  }
  if(line) lines.push(line);
  lines = lines.slice(0,3);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
}

function bindQuizPlayHandlers(){
  document.querySelectorAll('#optsWrap .quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      quizRuntime.answers[quizRuntime.index] = +el.dataset.oidx;
      document.querySelectorAll('#optsWrap .quiz-opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ quizRuntime.index--; render(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(quizRuntime.answers[quizRuntime.index]===null){ if(!confirm('No answer selected. Continue anyway?')) return; }
    if(quizRuntime.index < quizRuntime.quiz.questions.length-1){
      quizRuntime.index++;
      render();
    } else {
      finishQuiz();
    }
  });
  startQuizTimer();
}
function startQuizTimer(){
  clearInterval(quizTimerInt);
  const timerEl = document.getElementById('quizTimer');
  quizTimerInt = setInterval(()=>{
    if(!quizRuntime || !timerEl) { clearInterval(quizTimerInt); return; }
    const secs = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
    const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s}`;
  }, 1000);
}
function finishQuiz(){
  clearInterval(quizTimerInt);
  const quiz = quizRuntime.quiz;
  let correct = 0;
  quiz.questions.forEach((q,i)=>{ if(quizRuntime.answers[i]===q.answerIndex) correct++; });
  const total = quiz.questions.length;
  const percentage = Math.round((correct/total)*100);
  const timeSpentSec = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
  const u = currentUser();
  const attempt = { id:uid('att'), ownerId:u.id, quizId:quiz.id, quizTitle:quiz.title, date: nowISO(), correct, total, percentage, timeSpentSec, answers: quizRuntime.answers.slice() };
  addHistoryDoc(attempt);
  window.__lastAttempt = attempt;
  go('/quiz-results');
}

async function bindQuizSubmissionsHandlers(quizId){
  const card = document.getElementById('submissionsCard');
  const loadSubs = ()=> getDocs(collection(firestore, 'publicQuizzes', quizId, 'submissions'));
  try{
    let snap;
    try{ snap = await withTimeout(loadSubs(), 20000); }
    catch(first){
      /* The rule reads publicQuizzes/{quizId}.ownerId, so it is denied when that
         public copy was never published. Re-publish it once, then retry. */
      const q = getQuizzes().find(x=>x.id===quizId);
      if(q && first && first.code==='permission-denied' && await mirrorQuizPublic(q)){
        snap = await withTimeout(loadSubs(), 20000);
      }else throw first;

    const subs = snap.docs.map(d=>d.data()).sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt));
    if(!subs.length){
      card.innerHTML = `<div class="empty-card"><div class="icon">🧑‍🎓</div><p>No students have submitted this quiz yet. Share the QR code or link to get started.</p></div>`;
